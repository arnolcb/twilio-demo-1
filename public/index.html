<!DOCTYPE html>
<html>
<head>
  <title>Portal de Telepresencia</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .video-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    .video-box {
      position: relative;
    }
    video {
      width: 400px;
      height: 300px;
      background-color: #000;
      border-radius: 8px;
    }
    .controls {
      margin-top: 20px;
    }
    button {
      padding: 8px 16px;
      margin-right: 10px;
      cursor: pointer;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background-color: #3367d6;
    }
    #connectionStatus {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      background-color: #f0f0f0;
    }
    h1, h2 {
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Conexión Peer-to-Peer</h1>
  
  <div id="connectionStatus">Estado: Desconectado</div>
  
  <div class="video-container">
    <div class="video-box">
      <h2>Local</h2>
      <video id="local" autoplay muted playsinline></video>
    </div>
    <div class="video-box">
      <h2>Remoto</h2>
      <video id="remote" autoplay playsinline></video>
    </div>
  </div>
  
  <div class="controls">
    <button id="toggleVideo">Pausar Video</button>
    <button id="toggleAudio">Silenciar Audio</button>
    <button id="startCall">Iniciar Llamada</button>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
